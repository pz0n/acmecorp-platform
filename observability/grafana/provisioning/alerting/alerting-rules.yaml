apiVersion: 1

groups:
  - orgId: 1
    name: acmecorp-10s
    folder: AcmeCorp
    interval: 10s

    rules:
      - uid: orders-api-high-p95-latency
        title: Orders API - High p95 latency
        condition: C

        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                histogram_quantile(
                  0.95,
                  sum by (le) (
                    rate(
                      acmecorp_http_request_duration_milliseconds_bucket{
                        service_name="orders-api"
                      }[1m]
                    )
                  )
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce

          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1000
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold

        for: 20s
        noDataState: NoData
        execErrState: Error

        annotations:
          summary: Orders API p95 latency is above 1000 ms
          description: >
            The Orders API p95 request latency has remained above
            1000 ms for 20 seconds.

        labels:
          service: orders-api
          severity: warning

      - uid: payments-api-high-error-rate
        title: Payments API - High 5xx error rate
        condition: C

        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                100 *
                (
                  (
                    sum(
                      rate(
                        acmecorp_http_requests_total{
                          service_name="payments-api",
                          http_response_status_code=~"5.."
                        }[1m]
                      )
                    )
                    or vector(0)
                  )
                  /
                  clamp_min(
                    sum(
                      rate(
                        acmecorp_http_requests_total{
                          service_name="payments-api"
                        }[1m]
                      )
                    ),
                    0.001
                  )
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce

          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 20
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold

        for: 20s
        noDataState: NoData
        execErrState: Error

        annotations:
          summary: Payments API 5xx error rate is above 20 percent
          description: >
            The Payments API 5xx error rate has remained above
            20 percent for 20 seconds.

        labels:
          service: payments-api
          severity: warning